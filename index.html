<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敏娟的超級衣櫃系統</title>

    <style>
        :root {
            --panel: rgba(255, 255, 255, 0.84);
            --panel-strong: rgba(255, 255, 255, 0.95);
            --line: rgba(125, 95, 100, 0.18);
            --text: #403537;
            --muted: #756a6d;
            --accent: #b87688;
            --accent-dark: #96596c;
            --accent-soft: #f3e4e9;
            --danger: #b94c57;
            --success: #3d8065;
            --warning: #9a6d2f;
            --shadow: 0 20px 60px rgba(73, 52, 57, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans TC", sans-serif;
            color: var(--text);
            background-image:
                linear-gradient(rgba(255, 248, 247, 0.16), rgba(255, 248, 247, 0.16)),
                url("wardrobe-background.jpg");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(184, 118, 136, 0.32);
            outline-offset: 2px;
        }

        .page-shell {
            width: 100%;
            min-height: 100vh;
            padding: 32px 18px 64px;
        }

        .app-panel {
            width: min(1080px, 100%);
            margin: 0 auto;
            padding: 28px;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .title-area {
            text-align: center;
            margin-bottom: 22px;
        }

        .title-area h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            letter-spacing: 0.04em;
        }

        .title-area p {
            margin: 0;
            color: var(--muted);
        }

        .section-card {
            margin-top: 22px;
            padding: 22px;
            background: var(--panel-strong);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(71, 53, 57, 0.08);
        }

        .section-card h2,
        .section-card h3 {
            margin-top: 0;
        }

        .auth-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .user-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-email,
        .muted,
        .hint {
            color: var(--muted);
        }

        .user-email,
        .hint {
            font-size: 14px;
        }

        .status-message {
            display: none;
            margin: 18px 0 0;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .status-message.show {
            display: block;
        }

        .status-message.loading,
        .status-message.info {
            background: rgba(235, 227, 244, 0.94);
            color: #665370;
        }

        .status-message.success {
            background: rgba(226, 244, 235, 0.96);
            color: var(--success);
        }

        .status-message.error {
            background: rgba(250, 228, 230, 0.97);
            color: #a13f4b;
        }

        .tab-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 22px;
            padding: 6px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--line);
        }

        .tab-button {
            border: 0;
            border-radius: 12px;
            padding: 11px 12px;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
        }

        .tab-button.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 5px 16px rgba(184, 118, 136, 0.25);
        }

        .tab-panel[hidden] {
            display: none !important;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-section.full {
            grid-column: 1 / -1;
        }

        label,
        .field-label {
            display: inline-block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input[type="text"],
        input[type="search"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d8cfd1;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .hidden {
            display: none !important;
        }

        .condition-area,
        .multi-choice-area {
            display: flex;
            gap: 10px 14px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .condition-area label,
        .multi-choice-area label,
        .check-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-weight: 500;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
            margin-top: 12px;
        }

        .tag-row input {
            flex: 1;
        }

        .tag-list,
        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag,
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #f3e7eb;
            color: #785663;
            font-size: 14px;
        }

        .tag button {
            border: 0;
            background: transparent;
            color: #785663;
            padding: 0;
            line-height: 1;
            font-size: 16px;
        }

        .color-picker-row,
        .photo-actions,
        .button-row,
        .section-heading-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .section-heading-row {
            justify-content: space-between;
        }

        input[type="color"] {
            width: 74px;
            height: 44px;
            padding: 3px;
            border: 1px solid #d8cfd1;
            border-radius: 10px;
            background: white;
        }

        .photo-preview-wrap {
            margin-top: 12px;
            width: min(260px, 100%);
            padding: 10px;
            border: 1px dashed #d6c4ca;
            border-radius: 14px;
            background: #faf7f8;
        }

        .photo-preview-wrap img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            background: white;
        }

        .primary-button,
        .secondary-button,
        .danger-button,
        .small-button,
        .icon-button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            transition: 0.18s ease;
        }

        .primary-button {
            background: var(--accent);
            color: white;
        }

        .primary-button:hover {
            background: var(--accent-dark);
        }

        .secondary-button,
        .small-button {
            background: #eee7e9;
            color: #5d5154;
        }

        .danger-button {
            background: #f4dfe2;
            color: var(--danger);
        }

        .icon-button {
            width: 42px;
            height: 42px;
            padding: 0;
            display: inline-grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.92);
            color: #745560;
            box-shadow: 0 5px 16px rgba(52, 37, 42, 0.14);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .filters .wide-filter {
            grid-column: span 2;
        }

        .favorite-filter {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 4px;
            font-weight: 600;
        }

        .result-count {
            margin: 0 0 14px;
            color: var(--muted);
        }

        #wardrobeList {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .clothes-card {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 8px 24px rgba(76, 54, 60, 0.08);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .clothes-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(76, 54, 60, 0.13);
        }

        .card-open-button {
            width: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            text-align: left;
            color: inherit;
        }

        .clothes-card img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: contain;
            background: linear-gradient(135deg, #fbf8f8, #f1eded);
            padding: 8px;
        }

        .favorite-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            font-size: 21px;
        }

        .favorite-button.is-favorite {
            color: #c45472;
        }

        .card-body {
            padding: 14px;
        }

        .card-body h3 {
            margin: 0 0 7px;
            font-size: 18px;
        }

        .card-summary {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .color-line {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.18);
            flex: 0 0 auto;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 36px 18px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed #d4c4c9;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.72);
        }

        dialog {
            width: min(720px, calc(100vw - 24px));
            max-height: calc(100vh - 36px);
            overflow: auto;
            padding: 0;
            border: 0;
            border-radius: 22px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 30px 80px rgba(40, 28, 32, 0.32);
        }

        dialog::backdrop {
            background: rgba(42, 31, 34, 0.48);
            backdrop-filter: blur(4px);
        }

        .dialog-inner {
            padding: 22px;
        }

        .dialog-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .dialog-header h2 {
            margin: 0;
        }

        .detail-image {
            width: 100%;
            max-height: 460px;
            object-fit: contain;
            border-radius: 16px;
            background: #f5f1f2;
            padding: 10px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .detail-block {
            padding: 12px;
            border-radius: 12px;
            background: #faf6f7;
            border: 1px solid #eee3e6;
        }

        .detail-block strong {
            display: block;
            margin-bottom: 5px;
        }

        .snackbar {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(120px);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(560px, calc(100vw - 28px));
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(54, 45, 48, 0.96);
            color: white;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: 0.22s ease;
        }

        .snackbar.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .snackbar button {
            margin-left: auto;
            border: 0;
            background: #f3dde4;
            color: #704d59;
            border-radius: 9px;
            padding: 8px 12px;
            font-weight: 700;
        }

        .outfit-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .outfit-card {
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
        }

        .outfit-card h3 {
            margin: 0 0 8px;
        }

        .outfit-thumbnails {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 12px 0;
        }

        .outfit-thumbnails img,
        .missing-thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 10px;
            background: #f6f1f2;
            padding: 4px;
        }

        .missing-thumbnail {
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .outfit-picker {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .outfit-choice {
            position: relative;
        }

        .outfit-choice input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .outfit-choice label {
            display: block;
            height: 100%;
            padding: 8px;
            margin: 0;
            border: 2px solid transparent;
            border-radius: 12px;
            background: #f7f3f4;
            cursor: pointer;
        }

        .outfit-choice input:checked + label {
            border-color: var(--accent);
            background: #fbf0f4;
        }

        .outfit-choice img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: white;
            border-radius: 9px;
        }

        .outfit-choice .choice-title {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.35;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .stat-card {
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(145deg, #fff, #f9f0f3);
            border: 1px solid #eee0e5;
        }

        .stat-card .stat-number {
            display: block;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stats-columns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .stats-box {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
        }

        .bar-row {
            display: grid;
            grid-template-columns: minmax(72px, 120px) 1fr auto;
            gap: 9px;
            align-items: center;
            margin: 9px 0;
        }

        .bar-track {
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: #eee5e8;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #c98da0, #b87688);
        }

        @media (max-width: 860px) {
            .filters {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .filters .wide-filter {
                grid-column: 1 / -1;
            }

            #wardrobeList,
            .outfit-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .stats-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .stats-columns {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            body {
                background-attachment: scroll;
            }

            .page-shell {
                padding: 14px 10px 40px;
            }

            .app-panel {
                padding: 16px;
                border-radius: 20px;
            }

            .form-grid,
            .filters,
            #wardrobeList,
            .outfit-grid,
            .detail-grid,
            .outfit-picker,
            .stats-summary {
                grid-template-columns: 1fr;
            }

            .filters .wide-filter {
                grid-column: auto;
            }

            .section-card {
                padding: 16px;
            }

            .clothes-card img {
                height: 360px;
            }

            .outfit-choice img {
                height: 220px;
            }

            .tab-button {
                padding: 10px 4px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <main class="app-panel">
            <header class="title-area">
                <h1>敏娟的超級衣櫃系統</h1>
                <p>整理衣服、建立穿搭，也更快找到今天想穿的那一件。</p>
            </header>

            <section class="section-card auth-box">
                <button id="googleLoginButton" class="primary-button" type="button">
                    使用 Google 帳戶登入
                </button>

                <div id="userInfo" class="user-info" hidden>
                    <img id="userPhoto" class="user-photo" alt="Google 使用者頭像" hidden>
                    <div>
                        <div id="userName"></div>
                        <div id="userEmail" class="user-email"></div>
                    </div>
                    <button id="logoutButton" class="secondary-button" type="button">登出</button>
                </div>
            </section>

            <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

            <div id="appArea" hidden>
                <nav class="tab-bar" aria-label="主要功能">
                    <button class="tab-button active" type="button" data-tab="wardrobe">👗 衣櫃</button>
                    <button class="tab-button" type="button" data-tab="outfits">✨ 穿搭</button>
                    <button class="tab-button" type="button" data-tab="stats">📊 統計</button>
                </nav>

                <div id="wardrobeTab" class="tab-panel">
                    <section class="section-card" id="editSection">
                        <h2 id="formTitle">新增衣服</h2>

                        <div class="form-grid">
                            <div class="form-section full">
                                <label for="photoInput">衣服照片：</label>
                                <input id="photoInput" type="file" accept="image/*">

                                <div class="photo-actions">
                                    <button id="cameraButton" class="secondary-button" type="button">📷 手機直接拍照</button>
                                    <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
                                    <span id="photoHint" class="hint">新增衣服時請選擇一張照片。</span>
                                </div>

                                <div id="photoPreviewWrap" class="photo-preview-wrap hidden">
                                    <img id="photoPreview" alt="衣服照片預覽">
                                </div>
                            </div>

                            <div class="form-section">
                                <label for="mainCategorySelect">衣服大類：</label>
                                <select id="mainCategorySelect"></select>
                                <input id="mainCategoryOther" class="hidden" type="text" placeholder="輸入其他大類">
                            </div>

                            <div class="form-section">
                                <label for="subCategorySelect">細分類：</label>
                                <select id="subCategorySelect" disabled>
                                    <option value="">請先選擇衣服大類</option>
                                </select>
                                <input id="subCategoryOther" class="hidden" type="text" placeholder="輸入其他細分類">
                            </div>

                            <div class="form-section">
                                <label for="mainColorSelect">主色系：</label>
                                <select id="mainColorSelect"></select>
                                <input id="mainColorOther" class="hidden" type="text" placeholder="輸入其他主色系">
                            </div>

                            <div class="form-section">
                                <label for="detailColorSelect">細部顏色：</label>
                                <select id="detailColorSelect" disabled>
                                    <option value="">請先選擇主色系</option>
                                </select>
                                <input id="detailColorOther" class="hidden" type="text" placeholder="輸入其他細部顏色">
                            </div>

                            <div class="form-section full">
                                <span class="field-label">實際顏色：</span>
                                <div class="color-picker-row">
                                    <input id="colorPicker" type="color" value="#7d90b2">
                                    <label class="check-inline">
                                        <input id="useExactColor" type="checkbox">
                                        記錄這個實際色碼
                                    </label>
                                    <span id="colorHexPreview" class="hint">#7D90B2</span>
                                </div>
                            </div>

                            <div class="form-section full">
                                <span class="field-label">適合季節（可複選）：</span>
                                <div class="multi-choice-area">
                                    <label><input type="checkbox" name="season" value="春"> 春</label>
                                    <label><input type="checkbox" name="season" value="夏"> 夏</label>
                                    <label><input type="checkbox" name="season" value="秋"> 秋</label>
                                    <label><input type="checkbox" name="season" value="冬"> 冬</label>
                                </div>
                            </div>

                            <div class="form-section full">
                                <span class="field-label">適合場合（可複選）：</span>
                                <div class="multi-choice-area">
                                    <label><input type="checkbox" name="occasion" value="上班"> 上班</label>
                                    <label><input type="checkbox" name="occasion" value="正式"> 正式</label>
                                    <label><input type="checkbox" name="occasion" value="約會"> 約會</label>
                                    <label><input type="checkbox" name="occasion" value="運動"> 運動</label>
                                    <label><input type="checkbox" name="occasion" value="居家"> 居家</label>
                                    <label><input type="checkbox" name="occasion" value="休閒"> 休閒</label>
                                </div>
                            </div>

                            <div class="form-section full">
                                <span class="field-label">衣服狀況：</span>
                                <div class="condition-area">
                                    <label><input type="checkbox" name="condition" value="泛黃"> 泛黃</label>

        function subscribeToRecords(uid) {
            // 為了沿用你現在的 Firestore 規則，穿搭也存在同一個 clothes collection。
            // 衣服：recordType 沒有值或是 clothing；穿搭：recordType = outfit。
            const recordsCollection = collection(db, "users", uid, "clothes");
            const recordsQuery = query(recordsCollection, orderBy("createdAt", "desc"));

            unsubscribeRecords = onSnapshot(
                recordsQuery,
                function (snapshot) {
                    const records = snapshot.docs.map(function (documentSnapshot) {
                        return {
                            id: documentSnapshot.id,
                            ...documentSnapshot.data()
                        };
                    });

                    outfits = records.filter(function (item) {
                        return item.recordType === "outfit";
                    });

                    clothes = records.filter(function (item) {
                        return item.recordType !== "outfit";
                    });

                    rebuildRememberedOptions();
                    populateFilterOptions();
                    renderWardrobe();
                    renderOutfits();
                    renderStats();
                    refreshOpenDetailDialog();

                    showStatus(
                        `已載入 ${clothes.length} 件衣服、${outfits.length} 套穿搭。`,
                        "success",
                        true
                    );
                },
                function (error) {
                    console.error(error);
                    showStatus("讀取雲端衣櫃失敗：" + error.message, "error");
                }
            );
        }

        // ===== 會記住曾經使用過的分類與顏色 =====
        function rebuildRememberedOptions() {
            const currentCategory = getMainCategoryValue();
            const currentMainColor = getMainColorValue();

            const rememberedCategories = uniqueSorted(
                clothes.map(function (item) {
                    return item.mainCategory || "";
                })
            );

            const categoryOptions = uniqueSorted([
                ...baseMainCategories,
                ...rememberedCategories
            ]);

            fillFormSelectWithOther(
                mainCategorySelect,
                "請選擇",
                categoryOptions,
                currentCategory,
                mainCategoryOther
            );

            const rememberedColors = uniqueSorted(
                clothes.map(function (item) {
                    return item.mainColor || item.colorName || "";
                })
            );

            const colorOptions = uniqueSorted([
                ...baseMainColors,
                ...rememberedColors
            ]);

            fillFormSelectWithOther(
                mainColorSelect,
                "請選擇",
                colorOptions,
                currentMainColor,
                mainColorOther
            );

            updateSubCategoryOptions(getSubCategoryValue());
            updateDetailColorOptions(getDetailColorValue());
        }

        function fillFormSelectWithOther(selectElement, firstText, values, selectedValue, otherInput) {
            selectElement.innerHTML = "";

            const firstOption = document.createElement("option");
            firstOption.value = "";
            firstOption.textContent = firstText;
            selectElement.appendChild(firstOption);

            values.forEach(function (value) {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = value;
                selectElement.appendChild(option);
            });

            const otherOption = document.createElement("option");
            otherOption.value = "其他";
            otherOption.textContent = "其他（自行輸入）";
            selectElement.appendChild(otherOption);

            if (!selectedValue) {
                selectElement.value = "";
                otherInput.classList.add("hidden");
                otherInput.value = "";
                return;
            }

            if (values.includes(selectedValue)) {
                selectElement.value = selectedValue;
                otherInput.classList.add("hidden");
                otherInput.value = "";
            } else {
                selectElement.value = "其他";
                otherInput.classList.remove("hidden");
                otherInput.value = selectedValue;
            }
        }

        async function saveClothes() {
            if (!currentUser) {
                showStatus("請先使用 Google 帳戶登入。", "error");
                return;
            }

            const mainCategory = getMainCategoryValue();
            const subCategory = getSubCategoryValue();
            const mainColor = getMainColorValue();
            const detailColor = getDetailColorValue();
            const colorHex = useExactColor.checked ? colorPicker.value : "";
            const seasons = getCheckedValues("season");
            const occasions = getCheckedValues("occasion");
            const conditions = getAllConditions();
            const notes = notesInput.value.trim();

            if (!mainCategory || !subCategory) {
                showStatus("請填寫衣服大類與細分類。", "error");
                return;
            }

            if (!editingId && !pendingPhotoFile) {
                showStatus("新增衣服時請先選擇或拍攝一張照片。", "error");
                return;
            }

            if (!mainColor) {
                showStatus("請至少選擇一個主色系。", "error");
                return;
            }

            addButton.disabled = true;
            cancelEditButton.disabled = true;
            addButton.textContent = editingId ? "修改中…" : "儲存中…";
            showStatus(editingId ? "正在修改衣服資料…" : "正在儲存衣服…", "loading");

            try {
                let imageData = editingOriginalImage;

                if (pendingPhotoFile) {
                    showStatus("正在處理照片…", "loading");
                    imageData = await compressImage(pendingPhotoFile);
                }

                const payload = {
                    recordType: "clothing",
                    image: imageData,
                    mainCategory,
                    subCategory,
                    mainColor,
                    detailColor,
                    colorName: mainColor,
                    colorHex,
                    seasons,
                    occasions,
                    conditions,
                    notes,
                    favorite: editingId
                        ? Boolean(clothes.find(function (item) { return item.id === editingId; })?.favorite)
                        : false,
                    updatedAt: serverTimestamp()
                };

                if (editingId) {
                    const clothesDocument = doc(db, "users", currentUser.uid, "clothes", editingId);
                    await updateDoc(clothesDocument, payload);
                    showStatus("衣服資料已修改。", "success", true);
                } else {
                    const clothesCollection = collection(db, "users", currentUser.uid, "clothes");
                    await addDoc(clothesCollection, {
                        ...payload,
                        createdAt: serverTimestamp()
                    });
                    showStatus("衣服已加入衣櫃。", "success", true);
                }

                clearForm();
            } catch (error) {
                console.error(error);
                showStatus(
                    (editingId ? "修改衣服失敗：" : "儲存衣服失敗：") + error.message,
                    "error"
                );
            } finally {
                addButton.disabled = false;
                cancelEditButton.disabled = false;
                addButton.textContent = editingId ? "儲存修改" : "加入衣櫃";
            }
        }

        function fillSelect(selectElement, firstText, values, previousValue) {
            selectElement.innerHTML = "";

            const firstOption = document.createElement("option");

            selectElement.appendChild(firstOption);

            values.forEach(function (value) {

        function getDisplayedClothes() {
            const keyword = searchInput.value.trim().toLowerCase();
            const category = filterMainCategory.value;
            const color = filterColor.value;
            const season = filterSeason.value;
            const occasion = filterOccasion.value;
            const condition = filterCondition.value;

            const filtered = clothes.filter(function (item) {
                const itemMainColor = item.mainColor || item.colorName || "";
                const itemDetailColor = item.detailColor || "";
                const itemConditions = Array.isArray(item.conditions) ? item.conditions : [];
                const itemSeasons = Array.isArray(item.seasons) ? item.seasons : [];
                const itemOccasions = Array.isArray(item.occasions) ? item.occasions : [];

                const searchableText = [
                    item.mainCategory || "",
                    item.subCategory || "",
                    itemMainColor,
                    itemDetailColor,
                    ...itemSeasons,
                    ...itemOccasions,
                    ...itemConditions,
                    item.notes || ""
                ].join(" ").toLowerCase();

                return (
                    (!keyword || searchableText.includes(keyword)) &&
                    (!category || item.mainCategory === category) &&
                    (!color || itemMainColor === color) &&
                    (!season || itemSeasons.includes(season)) &&
                    (!occasion || itemOccasions.includes(occasion)) &&
                    (!condition || itemConditions.includes(condition)) &&
                    (!favoriteOnly.checked || Boolean(item.favorite))
                );
            });

            const sorted = [...filtered];

            sorted.sort(function (a, b) {
                if (sortSelect.value === "oldest") {
                    return timestampToMillis(a.createdAt) - timestampToMillis(b.createdAt);
                }

                if (sortSelect.value === "favorite") {
                    const favoriteDifference = Number(Boolean(b.favorite)) - Number(Boolean(a.favorite));
                    return favoriteDifference || timestampToMillis(b.createdAt) - timestampToMillis(a.createdAt);
                }

                if (sortSelect.value === "category") {
                    const aText = `${a.mainCategory || ""} ${a.subCategory || ""}`;
                    const bText = `${b.mainCategory || ""} ${b.subCategory || ""}`;
                    return aText.localeCompare(bText, "zh-Hant");
                }

                if (sortSelect.value === "color") {
                    const aText = `${a.mainColor || a.colorName || ""} ${a.detailColor || ""}`;
                    const bText = `${b.mainColor || b.colorName || ""} ${b.detailColor || ""}`;
                    return aText.localeCompare(bText, "zh-Hant");
                }

                return timestampToMillis(b.createdAt) - timestampToMillis(a.createdAt);
            });

            return sorted;
        }

                wardrobeList.appendChild(emptyState);
                return;

            displayed.forEach(function (item) {

                favoriteButton.type = "button";
                favoriteButton.className = "favorite-button icon-button";

                body.appendChild(colorLine);

                const miniChips = document.createElement("div");
                miniChips.className = "chip-list";
                const labels = [
                    ...(item.seasons || []).slice(0, 2),
                    ...(item.occasions || []).slice(0, 1)
                ];
                labels.forEach(function (label) {
                    miniChips.appendChild(createChip(label));
                });

                if (labels.length > 0) {
                    body.appendChild(miniChips);
                }

                openButton.appendChild(body);
                card.appendChild(openButton);
                wardrobeList.appendChild(card);
            });
        }

            }

            const item = clothes.find(function (candidate) {
                return candidate.id === activeDetailItemId;
            });

            if (!item) {
                detailDialog.close();
                activeDetailItemId = null;
                return;
            }

            renderDetailDialog(item);
        }

        closeDetailButton.addEventListener("click", function () {
            detailDialog.close();
        });

        detailDialog.addEventListener("close", function () {
            activeDetailItemId = null;
        });

        detailFavoriteButton.addEventListener("click", function () {
            const item = clothes.find(function (candidate) {
                return candidate.id === activeDetailItemId;
            });
            if (item) {
                toggleFavorite(item);
            }
        });

        detailEditButton.addEventListener("click", function () {
            const item = clothes.find(function (candidate) {
                return candidate.id === activeDetailItemId;
            });
            if (item) {
                startEdit(item);
            }
        });

        detailDeleteButton.addEventListener("click", function () {
            const item = clothes.find(function (candidate) {
                return candidate.id === activeDetailItemId;
            });
            if (item) {
                removeClothes(item);
            }
        });

        // ===== 穿搭 =====
        newOutfitButton.addEventListener("click", function () {
            openOutfitEditor();
        });

        closeOutfitButton.addEventListener("click", function () {
            outfitDialog.close();
        });

        cancelOutfitButton.addEventListener("click", function () {
            outfitDialog.close();
        });

        saveOutfitButton.addEventListener("click", saveOutfit);

        function openOutfitEditor(outfit = null) {
            if (clothes.length < 2) {
                showStatus("至少要有兩件衣服，才能建立一套穿搭。", "error", true);
                return;
            }

            editingOutfitId = outfit ? outfit.id : null;
            outfitDialogTitle.textContent = outfit ? "修改穿搭" : "建立穿搭";
            outfitNameInput.value = outfit?.name || "";
            outfitSeasonSelect.value = outfit?.season || "";
            outfitOccasionSelect.value = outfit?.occasion || "";
            outfitNotesInput.value = outfit?.notes || "";

            renderOutfitPicker(outfit?.clothingIds || []);
            outfitDialog.showModal();
        }

        function renderOutfitPicker(selectedIds) {
            outfitClothingPicker.innerHTML = "";

            clothes.forEach(function (item) {
                const wrapper = document.createElement("div");
                wrapper.className = "outfit-choice";

                const input = document.createElement("input");
                input.type = "checkbox";
                input.id = `outfit-choice-${item.id}`;
                input.value = item.id;
                input.checked = selectedIds.includes(item.id);

                const label = document.createElement("label");
                label.htmlFor = input.id;

                const image = document.createElement("img");
                image.src = item.image || "";
                image.alt = `${item.mainCategory || "衣服"} ${item.subCategory || ""}`;

                const title = document.createElement("div");
                title.className = "choice-title";
                title.textContent = `${item.mainCategory || "未分類"}／${item.subCategory || "未分類"}`;

                label.appendChild(image);
                label.appendChild(title);
                wrapper.appendChild(input);
                wrapper.appendChild(label);
                outfitClothingPicker.appendChild(wrapper);
            });
        }

        async function saveOutfit() {
            if (!currentUser) {
                return;
            }

            const name = outfitNameInput.value.trim();
            const clothingIds = Array.from(
                outfitClothingPicker.querySelectorAll('input[type="checkbox"]:checked')
            ).map(function (input) {
                return input.value;
            });

            if (!name) {
                showStatus("請替這套穿搭取一個名稱。", "error", true);
                return;
            }

            if (clothingIds.length < 2) {
                showStatus("一套穿搭至少要選兩件衣服。", "error", true);
                return;
            }

            saveOutfitButton.disabled = true;
            saveOutfitButton.textContent = editingOutfitId ? "修改中…" : "儲存中…";
            showStatus("正在儲存穿搭…", "loading");

            const payload = {
                recordType: "outfit",
                name,
                clothingIds,
                season: outfitSeasonSelect.value,
                occasion: outfitOccasionSelect.value,
                notes: outfitNotesInput.value.trim(),
                updatedAt: serverTimestamp()
            };

            try {
                if (editingOutfitId) {
                    await updateDoc(
                        doc(db, "users", currentUser.uid, "clothes", editingOutfitId),
                        payload
                    );
                    showStatus("穿搭已修改。", "success", true);
                } else {
                    await addDoc(
                        collection(db, "users", currentUser.uid, "clothes"),
                        {
                            ...payload,
                            createdAt: serverTimestamp()
                        }
                    );
                    showStatus("穿搭已儲存。", "success", true);
                }

                outfitDialog.close();
                editingOutfitId = null;
            } catch (error) {
                console.error(error);
                showStatus("儲存穿搭失敗：" + error.message, "error");
            } finally {
                saveOutfitButton.disabled = false;
                saveOutfitButton.textContent = "儲存穿搭";
            }
        }

        async function deleteOutfit(outfit) {
            if (!currentUser) {
                return;
            }

            const confirmed = confirm(`確定要刪除穿搭「${outfit.name || "未命名穿搭"}」嗎？`);
            if (!confirmed) {
                return;
            }

            try {
                await deleteDoc(doc(db, "users", currentUser.uid, "clothes", outfit.id));
                showStatus("穿搭已刪除。", "success", true);
            } catch (error) {
                console.error(error);
                showStatus("刪除穿搭失敗：" + error.message, "error");
            }
        }

        function renderOutfits() {
            outfitList.innerHTML = "";

            if (outfits.length === 0) {
                const emptyState = document.createElement("div");
                emptyState.className = "empty-state";
                emptyState.textContent = "還沒有保存任何穿搭。";
                outfitList.appendChild(emptyState);
                return;
            }

            outfits.forEach(function (outfit) {
                const card = document.createElement("article");
                card.className = "outfit-card";

                const title = document.createElement("h3");
                title.textContent = outfit.name || "未命名穿搭";
                card.appendChild(title);

                const meta = document.createElement("div");
                meta.className = "muted";
                meta.textContent = [outfit.season, outfit.occasion].filter(Boolean).join("・") || "未指定季節與場合";
                card.appendChild(meta);

                const thumbnails = document.createElement("div");
                thumbnails.className = "outfit-thumbnails";

                const ids = Array.isArray(outfit.clothingIds) ? outfit.clothingIds : [];
                ids.slice(0, 4).forEach(function (id) {
                    const item = clothes.find(function (candidate) {
                        return candidate.id === id;
                    });

                    if (item) {
                        const image = document.createElement("img");
                        image.src = item.image || "";
                        image.alt = `${item.mainCategory || "衣服"} ${item.subCategory || ""}`;
                        thumbnails.appendChild(image);
                    } else {
                        const missing = document.createElement("div");
                        missing.className = "missing-thumbnail";
                        missing.textContent = "衣服已刪除";
                        thumbnails.appendChild(missing);
                    }
                });

                card.appendChild(thumbnails);

                const count = document.createElement("p");
                count.textContent = `${ids.length} 件單品`;
                card.appendChild(count);

                if (outfit.notes) {
                    const notes = document.createElement("p");
                    notes.textContent = outfit.notes;
                    card.appendChild(notes);
                }

                const actions = document.createElement("div");
                actions.className = "button-row";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "small-button";
                editButton.textContent = "修改";
                editButton.addEventListener("click", function () {
                    openOutfitEditor(outfit);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "danger-button";
                deleteButton.textContent = "刪除";
                deleteButton.addEventListener("click", function () {
                    deleteOutfit(outfit);
                });

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);
                card.appendChild(actions);

                outfitList.appendChild(card);
            });
        }

        // ===== 統計 =====
        function renderStats() {
            const favoriteCount = clothes.filter(function (item) {
                return Boolean(item.favorite);
            }).length;

            const attentionCount = clothes.filter(function (item) {
                return Array.isArray(item.conditions) && item.conditions.length > 0;
            }).length;

            statsSummary.innerHTML = "";

            [
                [clothes.length, "衣服總數"],
                [favoriteCount, "收藏衣服"],
                [outfits.length, "穿搭組合"],
                [attentionCount, "有衣況註記"]
            ].forEach(function ([number, label]) {
                const card = document.createElement("div");
                card.className = "stat-card";

                const numberElement = document.createElement("span");
                numberElement.className = "stat-number";
                numberElement.textContent = String(number);

                const labelElement = document.createElement("span");
                labelElement.textContent = label;

                card.appendChild(numberElement);
                card.appendChild(labelElement);
                statsSummary.appendChild(card);
            });

            renderCountBars(
                categoryStats,
                countValues(clothes.map(function (item) { return item.mainCategory || "未分類"; }))
            );

            renderCountBars(
                colorStats,
                countValues(clothes.map(function (item) { return item.mainColor || item.colorName || "未填寫"; }))
            );

            renderCountBars(
                seasonStats,
                countValues(clothes.flatMap(function (item) {
                    return Array.isArray(item.seasons) && item.seasons.length > 0 ? item.seasons : ["未指定"];
                }))
            );

            renderCountBars(
                conditionStats,
                countValues(clothes.flatMap(function (item) {
                    return Array.isArray(item.conditions) && item.conditions.length > 0 ? item.conditions : ["無特別註記"];
                }))
            );
        }

        function countValues(values) {
            const map = new Map();

            values.filter(Boolean).forEach(function (value) {
                map.set(value, (map.get(value) || 0) + 1);
            });

            return [...map.entries()].sort(function (a, b) {
                return b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), "zh-Hant");
            });
        }

        function renderCountBars(container, entries) {
            container.innerHTML = "";

            if (entries.length === 0) {
                container.textContent = "還沒有資料。";
                return;
            }

            const max = Math.max(...entries.map(function (entry) { return entry[1]; }), 1);

            entries.slice(0, 10).forEach(function ([label, count]) {
                const row = document.createElement("div");
                row.className = "bar-row";

                const name = document.createElement("span");
                name.textContent = label;

                const track = document.createElement("div");
                track.className = "bar-track";

                const fill = document.createElement("div");
                fill.className = "bar-fill";
                fill.style.width = `${Math.max(5, (count / max) * 100)}%`;
                track.appendChild(fill);

                const countElement = document.createElement("span");
                countElement.textContent = String(count);

                row.appendChild(name);
                row.appendChild(track);
                row.appendChild(countElement);
                container.appendChild(row);
            });
        }

        // ===== 圖片壓縮 =====
        function compressImage(file) {
            return new Promise(function (resolve, reject) {
                const reader = new FileReader();

                reader.onload = function (event) {
                    const image = new Image();

                    image.onload = function () {
                        const maxDimension = 700;
                        let width = image.width;
                        let height = image.height;

                        const largestSide = Math.max(width, height);

                        if (largestSide > maxDimension) {
                            const scale = maxDimension / largestSide;
                            width = Math.round(width * scale);
                            height = Math.round(height * scale);
                        }

                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;

                        const context = canvas.getContext("2d");
                        context.fillStyle = "#ffffff";
                        context.fillRect(0, 0, width, height);
                        context.drawImage(image, 0, 0, width, height);

                        let quality = 0.75;
                        let dataUrl = canvas.toDataURL("image/jpeg", quality);

                        while (estimateDataUrlBytes(dataUrl) > 650000 && quality > 0.35) {
                            quality -= 0.1;
                            dataUrl = canvas.toDataURL("image/jpeg", quality);
                        }

                        if (estimateDataUrlBytes(dataUrl) > 800000) {
                            reject(new Error("照片壓縮後仍然太大，請改用較小的照片。"));
                            return;
                        }

                        resolve(dataUrl);
                    };

                    image.onerror = function () {
                        reject(new Error("無法讀取這張圖片。"));
                    };

                    image.src = event.target.result;
                };

                reader.onerror = function () {
                    reject(new Error("無法讀取圖片檔案。"));
                };

                reader.readAsDataURL(file);
            });
        }

        function estimateDataUrlBytes(dataUrl) {
            const base64 = dataUrl.split(",")[1] || "";
            return Math.ceil(base64.length * 3 / 4);
        }

        // ===== 初始畫面 =====
        rebuildRememberedOptions();
        clearForm();
        renderWardrobe();
        renderOutfits();
        renderStats();
    </script>
